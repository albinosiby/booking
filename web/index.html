<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Manage bookings, spaces and business accounts.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F0F0F">
  <meta name="color-scheme" content="dark light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Booking OS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=20261030">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=20261030"/>

  <title>Booking OS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0F0F0F; }
    @media (prefers-color-scheme: light) { html, body { background: #F8F8F8; } }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #8a8a8a; transition: opacity .3s ease;
    }
    #splash .mark {
      width: 56px; height: 56px; border-radius: 16px;
      display: block; object-fit: contain;
      box-shadow: 0 10px 32px rgba(93, 214, 44, .35);
      animation: pulse 1.4s ease-in-out infinite;
    }
    #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(128,128,128,.2); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
      background: #5DD62C; animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(.92); opacity: .8; } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Booking OS">
    <img class="mark" src="icons/Icon-192.png?v=20261030" width="56" height="56" alt="" fetchpriority="high">
    <div>Booking OS</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 320);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
